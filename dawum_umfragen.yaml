# =============================================================================
# DAWUM Wahlumfragen für Home Assistant (v4 - mit Trend-Sensoren)
# =============================================================================
# 17 Parlamente x 7 Parteien x 2 = 238 Sensoren aus EINEM REST-Aufruf:
#
#   sensor.umfrage_<parlament>_<partei>   - jeweils neueste Einzelumfrage
#                                           (Wert kommt vom zuletzt
#                                            veroeffentlichenden Institut)
#
#   sensor.trend_<parlament>_<partei>     - Mittelwert aller Institute der
#                                           letzten 14 Tage (DAWUM-aehnlich)
#
# Sensoren ohne aktuelle Daten (Partei nicht in Umfrage / kein Institut hat
# in den letzten 14 Tagen befragt) werden "unknown" - das ist gewollt.
#
# Installation:
#   1. Diese Datei nach /homeassistant/packages/dawum_umfragen.yaml ablegen.
#   2. In configuration.yaml sicherstellen:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Konfiguration pruefen und Home Assistant neu starten.
#
# Datenquelle: https://api.dawum.de/  (Lizenz: ODC-ODbL)
# =============================================================================

rest:
  - resource: https://api.dawum.de/newest_surveys.json
    scan_interval: 3600
    timeout: 30
    sensor:

      # =====================================================
      # GRUPPE 1: Jeweils neueste Einzelumfrage je Parlament
      # =====================================================

      # ----- Bundestag (ID 0) -----
      - name: "Umfrage Bundestag CDU/CSU"
        unique_id: dawum_bundestag_cdu_csu
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:alpha-c-circle
        value_template: >-
          {% set parties = value_json.Parties %}
          {% set targets = ['CDU/CSU', 'CDU', 'CSU'] %}
          {% set surveys = value_json.Surveys.values() | selectattr("Parliament_ID", "eq", "0") | list %}
          {% if surveys | count > 0 %}
            {% set latest = surveys | sort(attribute="Date", reverse=True) | first %}
            {% set ns = namespace(val=none) %}
            {% for pid, val in latest.Results.items() %}
              {% if pid in parties and parties[pid].Shortcut in targets %}
                {% set ns.val = val %}
              {% endif %}
            {% endfor %}
            {{ ns.val if ns.val is not none else "unknown" }}
          {% else %}
            unknown
          {% endif %}
